service: nutrail-api
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 10
  environment:
    TABLE_NAME: !Ref MainTable
    BUCKET_NAME: !Ref FilesBucket
    MEAL_QUEUE_URL: !Ref MealProcessingQueue
    COGNITO_USER_POOL_ID: !Ref UserPool
    COGNITO_CLIENT_ID: !Ref UserPoolClient
    EMAIL_FROM: 'Nutrail <pedrohenriquedionisioalves@gmail.com>'
  httpApi:
    authorizers:
      cognito:
        identitySource: $request.header.Authorization
        issuerUrl: !Join ['', ['https://cognito-idp.', !Ref AWS::Region, '.amazonaws.com/', !Ref UserPool]]
        audience:
          - !Ref UserPoolClient
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - !GetAtt MainTable.Arn
            - !Join ['/', [!GetAtt MainTable.Arn, 'index', '*']]
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource: !Join ['/', [!GetAtt FilesBucket.Arn, '*']]
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !GetAtt MealProcessingQueue.Arn
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminDeleteUser
          Resource: !GetAtt UserPool.Arn
        - Effect: Allow
          Action:
            - ses:SendEmail
          Resource: !Join ['', ['arn:aws:ses:', !Ref AWS::Region, ':', !Ref AWS::AccountId, ':identity/*']]

build:
  esbuild:
    configFile: ./esbuild.config.js
    minify: true
    sourcemap:
      type: linked
      setNodeOptions: true

functions:
  - ${file(sls/functions/health.yml)}
  - ${file(sls/functions/signUp.yml)}
  - ${file(sls/functions/signIn.yml)}
  - ${file(sls/functions/refreshToken.yml)}
  - ${file(sls/functions/forgotPassword.yml)}
  - ${file(sls/functions/confirmForgotPassword.yml)}
  - ${file(sls/functions/customMessage.yml)}
  - ${file(sls/functions/getMe.yml)}
  - ${file(sls/functions/updateProfile.yml)}
  - ${file(sls/functions/updateGoals.yml)}

resources:
  - ${file(sls/resources/dynamodb.yml)}
  - ${file(sls/resources/s3.yml)}
  - ${file(sls/resources/sqs.yml)}
  - ${file(sls/resources/cognito.yml)}
