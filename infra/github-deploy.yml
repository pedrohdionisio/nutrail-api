AWSTemplateFormatVersion: '2010-09-09'
Description: Lets GitHub Actions deploy nutrail-api through OIDC, without long-lived AWS keys.

Parameters:
  Repository:
    Type: String
    Description: The repository as GitHub writes it in the OIDC subject, owner@ownerId/repo@repoId.
    Default: pedrohdionisio@67081399/nutrail-api@1386532154

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nutrail-api-cloudformation
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: nutrail-api-roles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                  - iam:GetRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/nutrail-api-*

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nutrail-api-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${Repository}:ref:refs/heads/main
                  - !Sub repo:${Repository}:environment:production
      Policies:
        - PolicyName: nutrail-api-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:aws:cloudformation:us-east-1:${AWS::AccountId}:stack/nutrail-api-*/*
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:Describe*
                  - cloudformation:List*
                  - cloudformation:Get*
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:CreateBucket
                  - s3:PutBucketPolicy
                  - s3:PutBucketTagging
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketPublicAccessBlock
                Resource:
                  - arn:aws:s3:::serverless-framework-deployments-us-east-1-*
                  - arn:aws:s3:::serverless-framework-deployments-us-east-1-*/*
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/serverless-framework/*
              - Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:ListVersionsByFunction
                Resource: !Sub arn:aws:lambda:us-east-1:${AWS::AccountId}:function:nutrail-api-*

Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
